# Deploy ALCROS to SmarterASP.NET via FTPS (lftp mirror — avoids FTP-Deploy-Action ECONNRESET on IIS).
# Setup: deploy/GITHUB_SMARTERASP.md

name: Deploy to SmarterASP.NET

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: smarterasp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Deploy via FTPS (lftp)
        env:
          HOST: ${{ secrets.SMARTERASP_FTP_SERVER }}
          USER: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          PASS: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          REMOTE: ${{ secrets.SMARTERASP_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${REMOTE:-/alcros/}"
          REMOTE_DIR="${REMOTE_DIR#/}"
          REMOTE_DIR="${REMOTE_DIR%/}"

          printf 'machine %s login %s password %s\n' "$HOST" "$USER" "$PASS" > ~/.netrc
          chmod 600 ~/.netrc

          lftp -c "
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 120
          open ftps://${HOST}:21
          cd ${REMOTE_DIR}
          lcd ${GITHUB_WORKSPACE}
          mirror --reverse --continue --verbose --parallel=1 \
            --exclude-glob .git/ \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .vscode/** \
            --exclude-glob config/database.local.php \
            --exclude-glob config/hosting.local.php \
            --exclude-glob storage/** \
            --exclude-glob uploads/ids/** \
            --exclude-glob uploads/staff/** \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob '**/*.log' \
            --exclude-glob db_loader_check.php \
            --exclude-glob Thumbs.db \
            --exclude-glob .DS_Store \
            --exclude-glob .ftp-deploy-sync-state.json \
            .
          bye
          "

          rm -f ~/.netrc
