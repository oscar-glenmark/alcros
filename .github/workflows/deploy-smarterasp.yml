# Deploy ALCROS to SmarterASP.NET via FTPS (lftp mirror).
# Setup: deploy/GITHUB_SMARTERASP.md

name: Deploy to SmarterASP.NET

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: smarterasp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Deploy via FTPS (lftp)
        env:
          HOST: ${{ secrets.SMARTERASP_FTP_SERVER }}
          USER: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          PASS: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          REMOTE: ${{ secrets.SMARTERASP_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASS:-}" ]; then
            echo "::error::Missing GitHub secrets. Add SMARTERASP_FTP_SERVER, USERNAME, and PASSWORD under Settings → Secrets → Actions."
            exit 1
          fi

          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"

          REMOTE_DIR="${REMOTE:-/alcros/}"
          REMOTE_DIR="${REMOTE_DIR#/}"
          REMOTE_DIR="${REMOTE_DIR%/}"
          if [ -z "$REMOTE_DIR" ]; then
            REMOTE_DIR="alcros"
          fi

          export HOST USER PASS REMOTE_DIR

          python3 << 'PY'
          import os
          host = os.environ["HOST"].strip()
          user = os.environ["USER"]
          password = os.environ["PASS"]
          remote = os.environ["REMOTE_DIR"]
          workspace = os.environ["GITHUB_WORKSPACE"]

          script = f"""set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set ftp:use-feat no
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 120
          debug 1
          open ftp://{host}:21
          user {user} {password}
          cd {remote}
          lcd {workspace}
          mirror --reverse --continue --verbose --parallel=1 \
            -x ^\\.git/ \
            -x ^\\.github/ \
            -x ^\\.vscode/ \
            -x database\\.local\\.php \
            -x hosting\\.local\\.php \
            -x ^storage/ \
            -x ^uploads/ids/ \
            -x ^uploads/staff/ \
            -x \\.env \
            -x \\.log$ \
            -x db_loader_check\\.php \
            -x Thumbs\\.db \
            -x \\.DS_Store \
            -x \\.ftp-deploy-sync-state\\.json \
            .
          bye
          """
          path = "/tmp/alcros-deploy.lftp"
          with open(path, "w", encoding="utf-8") as f:
              f.write(script)
          print(f"Wrote lftp script (host={host}, remote dir={remote})")
          PY

          lftp -f /tmp/alcros-deploy.lftp
          rm -f /tmp/alcros-deploy.lftp
