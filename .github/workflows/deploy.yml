name: Deploy ALCROS to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ALCROS
        uses: actions/checkout@v4

      - name: Write production database.local.php
        env:
          INFINITYFREE_DB_HOST: ${{ secrets.INFINITYFREE_DB_HOST }}
          INFINITYFREE_DB_NAME: ${{ secrets.INFINITYFREE_DB_NAME }}
          INFINITYFREE_DB_USER: ${{ secrets.INFINITYFREE_DB_USER }}
          INFINITYFREE_DB_PASSWORD: ${{ secrets.INFINITYFREE_DB_PASSWORD }}
        run: php scripts/write_database_local.php

      - name: Deploy files to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
